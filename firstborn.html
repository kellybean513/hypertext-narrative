<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Your Prime Membership</title>

    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>

     <header>
    <img src="./assets/img/ass-mazon_logo.png"
         alt="Ass-mazon Prime"
         class="amazon-logo-img">
    </header>


    <main class="confirmation-page">

        <h1>
            Please provide the name of your firstborn child
        </h1>


        
        <form action="interrupted.html" method="GET">

            <section class="password-section">

                <div class="password-label">

                    <label for="password">
                        Child's Name
                    </label>

                    </div>


                <input
                    id="password"
                    type="password"
                    autocomplete="off"
                    required
                >


                <button
                    type="submit"
                    style="display: none;">
                </button>

            </section>

        </form>


        <div class="buttons confirmation-buttons">

            <a href="index.html" class="keep-button">
                Keep Membership
            </a>


        </div>

    </main>

</body>

</html>
