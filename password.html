<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Your Prime Membership</title>

    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>

     <header>
    <img src="./assets/img/ass-mazon_logo.png"
         alt="Ass-mazon Prime"
         class="amazon-logo-img">
    </header>


    <main class="confirmation-page">

        <h1>
            Please enter your password to confirm your Prime membership cancellation
        </h1>


          <form action="id.html" method="GET">

            <section class="password-section">

                <div class="password-label">

                    <label for="password">
                        Password
                    </label>

                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <input
                    id="password"
                    type="password"
                    autocomplete="off"
                    required
                >


                <label for="reenter-password">
                    Reenter password:
                </label>


                <input
                    id="reenter-password"
                    type="password"
                    autocomplete="off"
                    required
                >


                <button
                    type="submit"
                    style="display: none;">
                </button>

            </section>

        </form>


        <div class="buttons confirmation-buttons">

            <a href="index.html" class="keep-button">
                Keep Membership
            </a>

            <a
                href="id.html"
                class="end-button"
                style="opacity: 0.5;"
            >
                End Membership Now
            </a>

        </div>

    </main>

</body>

</html>
